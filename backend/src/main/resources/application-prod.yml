spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:sqlite:/data/saanssaathi.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: ${DB_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
        format_sql: false
        default_batch_fetch_size: 30

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 3600000      # 1 hour
      refresh-token-expiration: 604800000   # 7 days

cors:
  allowed-origins: ${FRONTEND_URL:https://saanssaathi.vercel.app,http://localhost:5173}

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.saanssaathi: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

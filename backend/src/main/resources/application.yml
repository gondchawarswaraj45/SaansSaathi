spring:
  application:
    name: saanssaathi-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saanssaathi_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:saanssaathi_user}
    password: ${DB_PASSWORD:saanssaathi_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=15m

  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-for-hs256}
      access-token-expiration: 3600000      # 1 hour in ms
      refresh-token-expiration: 604800000   # 7 days in ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

openaq:
  api:
    key: ${OPENAQ_API_KEY:}
    base-url: https://api.openaq.org/v3

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
    max-output-tokens: 1024
    temperature: 0.4

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

# Spring Actuator (health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    disable-swagger-default-url: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.saanssaathi: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

---
# DEV profile overrides
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    com.saanssaathi: DEBUG

---
# PROD profile overrides
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 5

springdoc:
  swagger-ui:
    enabled: false   # Disable Swagger UI in production

logging:
  level:
    root: WARN
    com.saanssaathi: INFO

---
# TEST profile overrides
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:saanssaathi_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

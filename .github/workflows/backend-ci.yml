name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'backend/**', '.github/workflows/backend-ci.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/backend-ci.yml' ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Backend Test Suite (36 Tests)
        working-directory: backend
        env:
          DB_URL: jdbc:sqlite:saanssaathi.db
          JWT_SECRET: test-secret-key-for-ci-environment-must-be-at-least-32-chars-long
          OPENAQ_API_KEY: test_openaq_mock_key
          GEMINI_API_KEY: test_gemini_mock_key
          FRONTEND_URL: http://localhost:5173
        run: mvn clean test

      - name: Package Production JAR
        working-directory: backend
        run: mvn package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saanssaathi-backend-jar
          path: backend/target/*.jar
          retention-days: 7

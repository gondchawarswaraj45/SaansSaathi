name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**' ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: saanssaathi_test
          MYSQL_USER: saanssaathi_user
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/saanssaathi_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USERNAME: saanssaathi_user
          DB_PASSWORD: testpassword
          JWT_SECRET: test-secret-key-for-ci-environment-must-be-at-least-32-chars-long
          OPENAQ_API_KEY: test_openaq_key_not_used_in_unit_tests
          GEMINI_API_KEY: test_gemini_key_not_used_in_unit_tests
          FRONTEND_URL: http://localhost:5173
          SPRING_PROFILES_ACTIVE: test
        run: mvn test

      - name: Build JAR (skip tests - already ran)
        working-directory: backend
        run: mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

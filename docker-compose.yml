version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: saanssaathi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: saanssaathi_db
      MYSQL_USER: saanssaathi_user
      MYSQL_PASSWORD: saanssaathi_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saanssaathi-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/saanssaathi_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: saanssaathi_user
      DB_PASSWORD: saanssaathi_pass
      JWT_SECRET: dev-secret-key-replace-in-production-must-be-32-chars-min
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-your_openaq_api_key_here}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    # Comment above and uncomment below if running backend locally (not in Docker)
    # profiles: ["full"]

  # Optionally add a simple health checker
  # (useful to keep Render free tier awake in development proxies)

volumes:
  mysql_data:
    driver: local

networks:
  default:
    name: saanssaathi-network
